[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigi-provisioner"
version = "0.1.0"
description = "Inventory-driven TP-Link VIGI factory activation, regional setup, and ONVIF static IPv4 provisioning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography", "requests", "urllib3", "tomli; python_version < '3.11'"]

[tool.setuptools.packages.find]
where = ["src"]
